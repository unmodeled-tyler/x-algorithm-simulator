[project]
name = "xsim"
version = "0.1.0"
description = "Controllable local simulator of an X-style platform with synthetic agents and tunable algorithm"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

dependencies = [
    # Core simulation
    "pydantic>=2.0",
    "numpy>=1.26",
    # LLM access - hybrid local + remote (Ollama first, then any OpenAI-compatible)
    "ollama>=0.3.0",
    "openai>=1.0.0",
    # UI - Streamlit for the interactive simulator + settings panel
    "streamlit>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
extend-exclude = [
    "candidate-pipeline",
    "grox",
    "home-mixer",
    "phoenix",
    "thunder",
]

[tool.ruff.lint.per-file-ignores]
"simulator/app.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

# Note on phoenix/
# The phoenix/ directory contains a self-contained reference implementation
# of a miniature Grok-based recsys (JAX). It is kept for architectural inspiration
# but is not required to run the main xsim simulator.
